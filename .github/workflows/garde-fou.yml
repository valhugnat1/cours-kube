# Construit l'APK de Garde-fou (dossier garde-fou/) à chaque push qui y touche.
# L'APK se récupère dans l'onglet Actions → le run → « Artifacts ».
name: garde-fou

on:
  push:
    paths:
      - "garde-fou/**"
      - ".github/workflows/garde-fou.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garde-fou
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests du moteur de règles
        run: ./gradlew :core:test
      - name: Construction de l'APK
        run: >
          ./gradlew :app:assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=0.${{ github.run_number }}
      - run: mv app/build/outputs/apk/release/app-release.apk garde-fou.apk
      - uses: actions/upload-artifact@v4
        with:
          name: garde-fou-apk
          path: garde-fou/garde-fou.apk
